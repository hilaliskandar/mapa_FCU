        <!-- Main initialization script -->
        <script>
        let loadedScripts = 0;
        let totalScripts = 11; // number of deferred scripts
        let loadedDataFiles = 0;
        let totalDataFiles = 3;
        let mapInitialized = false;
        let layersInitialized = false;
        
        function updateProgress(message) {
            document.getElementById('loading-progress').textContent = message;
        }
        
        function loadDataFile(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = () => {
                    loadedDataFiles++;
                    updateProgress(`Carregando dados... (${loadedDataFiles}/${totalDataFiles})`);
                    resolve();
                };
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }
        
        function checkInitializationReady() {
            // Check if all deferred scripts and data files are loaded
            if (loadedScripts >= totalScripts && loadedDataFiles >= totalDataFiles && !layersInitialized) {
                updateProgress('Finalizando...');
                initializeLayers();
                layersInitialized = true;
                
                // Hide loading overlay after a brief delay to ensure smooth transition
                setTimeout(() => {
                    document.getElementById('loading-overlay').style.display = 'none';
                }, 300);
            }
        }
        
        // Track deferred script loading using a more reliable method
        let scriptsLoaded = 0;
        function trackScriptLoad() {
            scriptsLoaded++;
            loadedScripts = scriptsLoaded;
            updateProgress(`Carregando controles... (${loadedScripts}/${totalScripts})`);
            checkInitializationReady();
        }
        
        // Override to track script loading manually since defer event tracking is unreliable
        window.addEventListener('load', function() {
            // After window load, wait a bit for deferred scripts to complete
            setTimeout(() => {
                if (loadedScripts < totalScripts) {
                    loadedScripts = totalScripts; // Assume all scripts loaded after window load
                    checkInitializationReady();
                }
            }, 1000);
        });
        
        async function startLoading() {
            try {
                // Initialize basic map immediately
                updateProgress('Inicializando mapa...');
                initializeMap();
                mapInitialized = true;
                
                // Load all data files in parallel
                updateProgress('Carregando dados...');
                await Promise.all([
                    loadDataFile('data/MalhaMunicipalestadodeSoPaulo_2.js'),
                    loadDataFile('data/FavelaseComunidadesUrbanasSetorizadasCenso2022IBGE_3.js'),
                    loadDataFile('data/FavelaseComunidadesUrbanasNoSetorizadasCenso2022IBGE_4.js')
                ]);
                
                checkInitializationReady();
            } catch (error) {
                console.error('Error loading application:', error);
                updateProgress('Erro ao carregar. Recarregue a página.');
            }
        }
        
        function initializeMap() {
            window.map = L.map('map', {
                zoomControl: false, maxZoom: 28, minZoom: 1
            });
            
            // Show satellite base layer immediately
            map.createPane('pane_GoogleSatellite_0');
            map.getPane('pane_GoogleSatellite_0').style.zIndex = 400;
            window.layer_GoogleSatellite_0 = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
                pane: 'pane_GoogleSatellite_0',
                opacity: 1.0,
                attribution: '',
                minZoom: 1,
                maxZoom: 28,
                minNativeZoom: 0,
                maxNativeZoom: 20
            });
            layer_GoogleSatellite_0.addTo(map);
            
            // Set initial view to São Paulo
            map.setView([-23.5489, -46.6388], 10);
            
            // Add basic controls
            var zoomControl = L.control.zoom({
                position: 'topleft'
            }).addTo(map);
            
            // Set attribution
            map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        }
        
        function initializeLayers() {
            var hash = new L.Hash(map);
            var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
            
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        
        // add class to format popup if it contains media
		function addClassToPopupIfMedia(content, popup) {
			var tempDiv = document.createElement('div');
			tempDiv.innerHTML = content;
			if (tempDiv.querySelector('td img')) {
				popup._contentNode.classList.add('media');
					// Delay to force the redraw
					setTimeout(function() {
						popup.update();
					}, 10);
			} else {
				popup._contentNode.classList.remove('media');
			}
		}
        
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';
        
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
            if (bounds_group.getLayers().length) {
                map.fitBounds(bounds_group.getBounds());
            }
            map.setMaxBounds(map.getBounds());
        }
